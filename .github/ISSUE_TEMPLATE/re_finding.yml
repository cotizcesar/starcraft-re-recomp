name: Reverse-engineering finding
description: Report an address, structure or behaviour recovered from the binary
labels: [research]
body:
  - type: dropdown
    id: binary
    attributes:
      label: Binary
      options: [x86/StarCraft.exe (32-bit), x86_64/StarCraft.exe (64-bit), Launcher / CEF, Data (CASC/MPQ)]
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Address / offset and image base
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options: [FACT (observed), INFERENCE (hypothesis)]
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding and how to reproduce it
      description: Describe it in your own words. Do not paste decompiled Blizzard code.
    validations:
      required: true
  - type: textarea
    id: falsifier
    attributes:
      label: Experiment that would confirm or refute it
    validations:
      required: true
