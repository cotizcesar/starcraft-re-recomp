[package]
name = "galaxycraft"
version = "0.1.0"
edition = "2021"
description = "A Rust reconstruction of StarCraft 1.23 core gameplay logic, driven by data recovered from the shipped executable."
license = "MIT OR Apache-2.0"

[lib]
name = "galaxycraft"
path = "src/lib.rs"

# All binaries in src/bin/ are picked up by cargo's autobins; no [[bin]] needed.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
font8x8 = "0.3"
fontdue = { version = "0.9.5", default-features = false }
lewton = "0.10.2"
libloading = "0.8"
minifb = { version = "0.29", default-features = false, features = ["x11", "dlopen"] }
ogg = "0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"

[build-dependencies]
cc = "1.10.0"
